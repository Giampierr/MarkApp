name: Compilar MarcApp APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"


      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Comprobar Gradle Wrapper
        run: |
          test -f ./gradlew || { echo "Falta gradlew en la raiz del proyecto"; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "Falta gradle/wrapper/gradle-wrapper.jar"; exit 1; }
          chmod +x ./gradlew

      - name: Compilar APK debug (sin emulador)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Guardar APK para descargar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarcApp-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
